# CI pipeline, in the PDF "Deliverables" order:
# lint -> test -> build -> scan -> push -> helm-lint -> deploy (+ smoke) -> notify (always).
# The AI diagnosis job is added in the last stage (see TASKS.md).
# Every job calls the same make targets you run locally. Only the GHCR push lives in YAML alone.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # Explicit bash adds -o pipefail (the implicit default shell does not).
    shell: bash

env:
  # The commit the image is built from: the PR's head commit, never GitHub's synthetic merge commit.
  # make reads GIT_SHA from the environment (the Makefile uses ?=).
  GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  # Tool binaries: pinned version, verified against the sha256 from the official release checksums.
  TRIVY_VERSION: 0.76.2
  TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf # trivy_0.76.2_Linux-64bit.tar.gz
  K3D_VERSION: v5.9.0
  K3D_SHA256: 06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0 # k3d-linux-amd64
  HELM_VERSION: v4.3.1
  HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b # helm-v4.3.1-linux-amd64.tar.gz
  TERRAFORM_VERSION: 1.17.1
  TERRAFORM_SHA256: 4638628058e71a55212b1c563712eac03b902128f40740f3dc8174df12135061 # terraform_1.17.1_linux_amd64.zip
  UV_VERSION: 0.11.28
  UV_SHA256: e490a6464492183c5d4534a5527fb4440f7f2bb2f228162ad7e4afe076dc0224 # uv-x86_64-unknown-linux-gnu.tar.gz, checked by setup-uv

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.GIT_SHA }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_SHA256 }}
      - run: make venv lint

  test:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.GIT_SHA }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_SHA256 }}
      - run: make venv test

  build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.GIT_SHA }}
          persist-credentials: false
      - name: Set IMAGE (GHCR needs a lowercase owner)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/whatsmyip" >> "$GITHUB_ENV"
      - run: make build
      - name: Save image for the scan and push jobs
        run: docker save "$IMAGE:$GIT_SHA" | gzip > image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.tar.gz
          retention-days: 1
          if-no-files-found: error

  scan:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.GIT_SHA }}
          persist-credentials: false
      - name: Set IMAGE (GHCR needs a lowercase owner)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/whatsmyip" >> "$GITHUB_ENV"
      - name: Install Trivy (pinned, checksum-verified)
        run: |
          curl -fsSLo "$RUNNER_TEMP/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/bin" trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          # Pin the cache dir so the actions/cache path below always matches it.
          echo "TRIVY_CACHE_DIR=$HOME/.cache/trivy" >> "$GITHUB_ENV"
      - id: date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Cache the Trivy vulnerability DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy/db
          key: trivy-db-${{ steps.date.outputs.date }}
          restore-keys: trivy-db-
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - id: load
        run: docker load -i image.tar.gz
      - name: Scan gate (fail on fixable HIGH/CRITICAL)
        run: make scan
      # The report steps run even when the gate failed: that is when the findings matter most.
      - name: SARIF report
        if: always() && steps.load.outcome == 'success'
        run: make scan-sarif
      - name: Upload SARIF to Security > Code scanning
        if: always() && steps.load.outcome == 'success'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif
          category: trivy
      - name: SBOM (CycloneDX)
        if: always() && steps.load.outcome == 'success'
        run: make sbom
      - name: Upload SBOM artifact
        if: always() && steps.load.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error

  push:
    needs: scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Set IMAGE (GHCR needs a lowercase owner)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/whatsmyip" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - run: docker load -i image.tar.gz
      - name: Log in to GHCR with the per-run token
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - run: docker push "$IMAGE:$GIT_SHA"

  helm-lint:
    needs: push
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.GIT_SHA }}
          persist-credentials: false
      - name: Install Helm (pinned, checksum-verified)
        run: |
          curl -fsSLo "$RUNNER_TEMP/helm.tar.gz" "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  $RUNNER_TEMP/helm.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP/bin" --strip-components=1 linux-amd64/helm
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: make helm-lint

  deploy:
    needs: helm-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.GIT_SHA }}
          persist-credentials: false
      - name: Set IMAGE (GHCR needs a lowercase owner)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/whatsmyip" >> "$GITHUB_ENV"
      - name: Install k3d and Terraform (pinned, checksum-verified)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/bin/k3d" "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          echo "${K3D_SHA256}  $RUNNER_TEMP/bin/k3d" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/k3d"
          curl -fsSLo "$RUNNER_TEMP/terraform.zip" \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          echo "${TERRAFORM_SHA256}  $RUNNER_TEMP/terraform.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/terraform.zip" terraform -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: make cluster-create
      # Deploy and smoke share a job: the k3d cluster disappears when the job ends.
      # make deploy runs terraform apply: staging namespace + helm_release of the chart.
      - run: make deploy IMAGE_SOURCE=registry
      - run: make smoke

  notify:
    needs: [lint, test, build, scan, push, helm-lint, deploy]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Commit status ci/pipeline and job summary
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          state=success
          {
            echo "## Pipeline result"
            echo
            echo "| Job | Result |"
            echo "|---|---|"
            for job in lint test build scan push helm-lint deploy; do
              result=$(jq -r --arg job "$job" '.[$job].result' <<<"$NEEDS")
              echo "| $job | $result |"
              if [ "$result" != success ]; then state=failure; fi
            done
            echo
            echo "Commit status \`ci/pipeline\`: **$state**"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$state" = success ]; then
            description="All jobs passed"
          else
            description="Pipeline failed. See the run summary."
          fi
          gh api --silent "repos/$GITHUB_REPOSITORY/statuses/$GIT_SHA" \
            -f state="$state" -f context=ci/pipeline -f target_url="$run_url" -f description="$description"
