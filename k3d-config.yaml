apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: bigid
servers: 1
agents: 1
image: rancher/k3s:v1.35.5-k3s1
ports:
  - port: 8080:80
    nodeFilters:
      - loadbalancer
options:
  # Keep the user's default kubeconfig untouched; make cluster-create writes .kubeconfig instead.
  kubeconfig:
    updateDefaultKubeconfig: false
    switchCurrentContext: false
  k3s:
    extraArgs:
      # Traefik off: the app is exposed through ServiceLB (Service type LoadBalancer).
      - arg: --disable=traefik
        nodeFilters:
          - server:*
